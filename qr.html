<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>FinPocket QR - Yönetici</title>
<link rel="stylesheet" href="style.css">
<style>
body{padding:20px}
.qrBox{max-width:520px;margin:0 auto;background:#1e293b;border-radius:22px;padding:24px;text-align:center}
.qrBox h1{margin-bottom:8px}.qrBox p{color:#94a3b8;line-height:1.5}
.qrBox input{width:100%;padding:14px;border-radius:11px;border:1px solid #475569;background:#334155;color:#fff;font-size:15px;margin:18px 0 10px;box-sizing:border-box}
.qrBox button{width:100%;padding:14px;border:0;border-radius:11px;margin-top:8px;font-size:16px;font-weight:800;cursor:pointer}
.primary{background:#22c55e;color:#052e16}.secondary{background:#f59e0b;color:#111827}
.qrImage{background:#fff;border-radius:16px;padding:14px;margin:18px auto;width:min(100%,330px);min-height:40px}
.qrImage img{display:block;width:100%;height:auto}.warning{font-size:12px;color:#fbbf24;margin-top:14px}
.back{background:#334155;color:#fff}.error{color:#f87171!important;font-weight:700}
.lockBox{max-width:360px;margin:60px auto 0;background:#0f172a;border-radius:18px;padding:24px}
.hidden{display:none!important}
</style>
</head>
<body>
<main class="qrBox">

<section id="lockScreen" class="lockBox">
<h1>🔐 Yönetici QR</h1>
<p>QR oluşturmak için yönetici PIN'i gerekli.</p>
<input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Yönetici PIN'i">
<button class="primary" id="unlock">🔓 Giriş</button>
<p id="pinError" class="error"></p>
<button class="back" onclick="history.back()">← Geri</button>
</section>

<section id="qrScreen" class="hidden">
<h1>📱 FinPocket QR</h1>
<p>Bu QR'ı telefonla okut. Her telefon kendi verisini ayrı tutar.</p>
<input id="url" aria-label="FinPocket adresi">
<button class="primary" id="make">QR Oluştur</button>
<div class="qrImage" id="qr"><p>QR burada görünecek.</p></div>
<button class="secondary" id="open">Telefonda açılacak adresi test et</button>
<button class="back" onclick="history.back()">← Geri</button>
<p class="warning">Not: QR'ın telefonda çalışması için FinPocket HTTPS üzerinden yayınlanmış olmalıdır.</p>
</section>

</main>

<script>
const ADMIN_PIN = "8383";
const lockScreen = document.getElementById("lockScreen");
const qrScreen = document.getElementById("qrScreen");
const pinInput = document.getElementById("pin");
const pinError = document.getElementById("pinError");
const input = document.getElementById("url");
const qr = document.getElementById("qr");

function unlock(){
    if(pinInput.value === ADMIN_PIN){
        lockScreen.classList.add("hidden");
        qrScreen.classList.remove("hidden");
        pinInput.value = "";
        pinError.textContent = "";
        initQR();
    }else{
        pinError.textContent = "PIN yanlış.";
        pinInput.value = "";
        pinInput.focus();
    }
}

document.getElementById("unlock").onclick = unlock;
pinInput.addEventListener("keydown", e => {
    if(e.key === "Enter") unlock();
});

function initQR(){
    const target = new URL("./index.html?mobile=1", location.href);
    if(/^https?:$/.test(location.protocol)){
        input.value = target.href;
        make();
    }else{
        input.value = "";
    }
}

function make(){
    const v = input.value.trim();
    if(!/^https?:\/\//i.test(v)){
        qr.innerHTML='<p style="color:#fbbf24">Önce HTTPS ile başlayan FinPocket adresini gir.</p>';
        return;
    }
    const u='https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=10&data='+encodeURIComponent(v);
    qr.innerHTML='<img src="'+u+'" alt="FinPocket QR">';
}

document.getElementById("make").onclick = make;
document.getElementById("open").onclick = () => {
    if(input.value.trim()) location.href = input.value.trim();
};
</script>
</body>
</html>
